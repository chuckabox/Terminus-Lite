

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    ports:
      - "8001:8001"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - REDIS_HOST=redis
      - SLM_SERVICE_URL=http://slm_service:8002
      - PRIMARY_MODEL_TYPE=ollama
      - SLM_MODEL_TYPE=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - redis
      - slm_service
      - ollama

  slm_service:
    build:
      context: .
      dockerfile: Dockerfile.slm
    ports:
      - "8002:8002"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama

  dashboard:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8001

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
